name: Flixster
description: >-
  Flixster is an American movie-discovery and social entertainment brand founded
  in 2007 that let people rate and review movies, browse local showtimes, watch
  trailers, and share what they were watching. It grew into one of the largest
  movie communities on the web and mobile, and in 2011 was acquired by Warner
  Bros. together with Rotten Tomatoes; Fandango Media later acquired both Flixster
  and Rotten Tomatoes from Warner Bros. in 2016. The Flixster Video digital-locker
  service (built on UltraViolet) was shut down in 2019. The flixster.com property
  no longer operates as an independent consumer site — it now redirects to
  Fandango, and Flixster does not publish a public developer API, developer
  portal, or API documentation. This profile is maintained in the API Evangelist
  network as a company/brand record; there is no live API surface to enrich.
